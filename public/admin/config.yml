# Sveltia CMS configuration: https://sveltiacms.app/en/docs
# Every save in the admin panel becomes a commit in the GitHub repo,
# which triggers a rebuild and deploy on Cloudflare (about a minute).

backend:
  name: github
  repo: bbencohenn/bencohen-site # change if your repo name differs
  branch: main
  commit_messages:
    create: 'content: add {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'media: upload "{{path}}"'
    deleteMedia: 'media: delete "{{path}}"'

site_url: https://bencohen.com.au
display_url: https://bencohen.com.au
logo_url: /favicon.svg

# Default location for uploads that aren't attached to a post (e.g. the résumé PDF).
media_folder: public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      max_file_size: 10000000 # 10 MB
      # Photos and screenshots are converted to WebP in the browser on upload.
      # GIFs are deliberately left out: converting them in the browser keeps
      # only the first frame. The site build turns them into animated WebP.
      transformations:
        jpeg:
          format: webp
          quality: 85
          width: 2400
          height: 2400
        png:
          format: webp
          quality: 85
          width: 2400
          height: 2400
        heic:
          format: webp
          quality: 85
          width: 2400
          height: 2400
        avif:
          format: webp
          quality: 85
          width: 2400
          height: 2400
        webp:
          format: webp
          quality: 85
          width: 2400
          height: 2400
        svg:
          optimize: true

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Empty optional fields are left out of the file, so the site's schema stays happy.
output:
  omit_empty_optional_fields: true

collections:
  # ------------------------------------------------------------------ writing
  - name: posts
    label: Writing
    label_singular: Post
    description: Blog posts. Images you add are saved next to the post and optimised when the site builds.
    folder: src/content/posts
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{fields.title}}'
    summary: '{{fields.date | date("YYYY-MM-DD")}} · {{fields.title}}'
    sortable_fields:
      fields: [date, title, category]
      default:
        field: date
        direction: descending
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD }
      - name: category
        label: Category
        widget: relation
        collection: categories
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
      - { name: tags, label: Tags, widget: list, required: false, hint: Comma-separated, e.g. ctf, python }
      - { name: summary, label: Summary, widget: text, hint: One or two sentences. Shown in lists, search results and link previews. }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: cover_alt, label: Cover image description, widget: string, required: false, hint: Describe the image for screen readers. }
      - { name: draft, label: Draft (hidden from the site), widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: categories
    label: Categories
    label_singular: Category
    description: Writing categories. The file name becomes the URL, e.g. /writing/category/security/.
    folder: src/content/categories
    format: json
    extension: json
    create: true
    identifier_field: name
    slug: '{{fields.name}}'
    sortable_fields:
      fields: [order, name]
      default:
        field: order
        direction: ascending
    fields:
      - { name: name, label: Name, widget: string }
      - { name: description, label: Description, widget: string, required: false }
      - { name: order, label: Sort order, widget: number, value_type: int, default: 100 }

  # ------------------------------------------------------------------ work
  - name: projects
    label: Work
    label_singular: Project
    folder: src/content/projects
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{fields.title}}'
    summary: '{{fields.order}} · {{fields.title}}'
    sortable_fields:
      fields: [order, title, year]
      default:
        field: order
        direction: ascending
    fields:
      - { name: title, label: Title, widget: string }
      - { name: year, label: Year, widget: string, hint: e.g. 2026, or 2024–2025 }
      - { name: kind, label: Kind, widget: string, hint: e.g. Security, Web, Teaching }
      - { name: summary, label: Summary, widget: text }
      - { name: link, label: Live link, widget: string, required: false, pattern: ['^https://', 'Must start with https://'] }
      - { name: repo, label: Source code link, widget: string, required: false, pattern: ['^https://', 'Must start with https://'] }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: cover_alt, label: Cover image description, widget: string, required: false }
      - { name: featured, label: Show on homepage, widget: boolean, default: true }
      - { name: order, label: Sort order (lower first), widget: number, value_type: int, default: 100 }
      - { name: draft, label: Draft (hidden from the site), widget: boolean, default: false }
      - { name: body, label: Write-up, widget: markdown }

  # ------------------------------------------------------------------ timeline
  - name: timeline
    label: Timeline
    label_singular: Timeline entry
    description: >
      Each entry is drawn as a coloured line from start to end, with a square at each end.
      Leave "End" empty and "Ongoing" off for a one-off event (a single square).
      Lanes are worked out automatically so entries never overlap.
    folder: src/content/timeline
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{fields.title}}'
    summary: '{{fields.start | date("YYYY-MM")}} · {{fields.title}}'
    sortable_fields:
      fields: [start, title]
      default:
        field: start
        direction: descending
    fields:
      - { name: title, label: Title, widget: string, hint: Short; it's shown on the timeline itself. }
      - { name: place, label: Place, widget: string, required: false }
      - { name: start, label: Start, widget: datetime, type: date, format: YYYY-MM-DD }
      - { name: end, label: End, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: Leave empty for a one-off event or something still going. }
      - { name: ongoing, label: Still going, widget: boolean, default: false, hint: Draws the line up to today. }
      - { name: planned_end, label: Planned end, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: Optional. Shown as a dashed line after today, e.g. an expected graduation. }
      - { name: colour, label: Colour, widget: color, allowInput: true, default: '#6d28d9', pattern: ['^#[0-9a-fA-F]{6}$', 'Use a 6-digit hex colour like #6d28d9'] }
      - { name: summary, label: Hover summary, widget: text, hint: One or two sentences shown in the hover tooltip. }
      - name: kind
        label: Kind
        widget: select
        options: [work, study, travel, other]
        default: other
      - { name: draft, label: Draft (hidden from the site), widget: boolean, default: false }
      - { name: body, label: Full entry, widget: markdown, required: false }

  # ------------------------------------------------------------------ pages
  - name: pages
    label: Pages & settings
    files:
      - name: site
        label: Homepage, about & hiring details
        file: src/content/settings/site.json
        format: json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: title, label: Site title (browser tab, search results), widget: string }
          - { name: description, label: Site description (search results), widget: text }
          - { name: hero_lede, label: Homepage intro, widget: text }
          - name: hash_demo
            label: Hash demo inputs
            hint: The homepage cycles through these. Put your name first.
            widget: list
            field: { name: text, label: Text, widget: string }
          - { name: about_lead, label: About · first line, widget: string }
          - { name: about, label: About · body, widget: text, hint: Separate paragraphs with a blank line. }
          - { name: email, label: Email, widget: string }
          - { name: github, label: GitHub URL, widget: string }
          - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
          - name: resume_pdf
            label: Résumé PDF
            widget: file
            required: false
            media_folder: /public/files
            public_folder: /files
            hint: Upload a version without your phone number or home address; this file is public.
          - { name: pgp, label: PGP fingerprint, widget: string, required: false }
          - { name: location, label: Based in, widget: string }
          - { name: looking_for, label: Looking for, widget: string }
          - { name: available, label: Available from, widget: string }
          - { name: work_rights, label: Work rights, widget: string }
          - { name: degree, label: Degree, widget: string }
          - { name: languages, label: Programming languages, widget: string }
          - { name: also, label: Other skills, widget: string }
          - { name: timeline_from, label: Timeline starts in year, widget: number, value_type: int }
      - name: resume
        label: Résumé (plain page)
        file: src/content/pages/resume.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text }
          - { name: updated, label: Last updated, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
          - { name: body, label: Résumé, widget: markdown }
